version: '3.8'

services:
  lgd-map:
    image: ghcr.io/dawid268/lgd_owocowy_szlak_products_map/lgd-map:staging
    container_name: lgd-map-demo
    restart: unless-stopped
    
    # Resource limits (for Docker Swarm)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    
    # Environment variables (Caddy doesn't need PORT, but keeping for compatibility)
    environment:
      - NODE_ENV=production
      # Caddy will automatically handle HTTPS with Let's Encrypt
      - ACME_AGREE=true
    
    # Health check (Caddy serves on /health endpoint)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Ports: 80 (HTTP) and 443 (HTTPS)
    # Caddy will automatically get Let's Encrypt certificate via HTTP challenge on port 80
    ports:
      - "80:80"   # HTTP for Let's Encrypt challenge
      - "443:443" # HTTPS (automatic certificate from Let's Encrypt)
    
    # Volumes for Caddy data (certificates, config cache)
    # These persist Let's Encrypt certificates between container restarts
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    # Persistent storage for Caddy certificates and keys
    # Let's Encrypt certificates are stored here
  caddy_config:
    # Persistent storage for Caddy configuration cache
