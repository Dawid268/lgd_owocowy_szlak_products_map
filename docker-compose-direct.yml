version: '3.8'

services:
  lgd-map:
    image: ghcr.io/dawid268/lgd_owocowy_szlak_products_map/lgd-map:staging
    container_name: lgd-map-direct
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - PORT=8080
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Labels for Traefik - DIRECT ACCESS (no path prefix)
    labels:
      # Enable Traefik for this service
      - "traefik.enable=true"
      
      # HTTP router - direct access without path prefix
      - "traefik.http.routers.lgd-map-direct.rule=Host(`57.129.41.248`)"
      - "traefik.http.routers.lgd-map-direct.entrypoints=websecure"
      - "traefik.http.routers.lgd-map-direct.tls=true"
      - "traefik.http.routers.lgd-map-direct.tls.certresolver=letsencrypt"
      
      # Service configuration
      - "traefik.http.services.lgd-map-direct.loadbalancer.server.port=8080"
      
      # Security headers
      - "traefik.http.middlewares.lgd-map-security.headers.frameDeny=true"
      - "traefik.http.middlewares.lgd-map-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.lgd-map-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.lgd-map-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.lgd-map-direct.middlewares=lgd-map-security"
      
      # Compression
      - "traefik.http.middlewares.lgd-map-compress.compress=true"
      - "traefik.http.routers.lgd-map-direct.middlewares=lgd-map-compress"
    
    # Networks
    networks:
      - traefik-public
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik-public:
    external: true
